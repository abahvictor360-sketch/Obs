name: Something is missing
description: Suggest a feature or something OBS Studio has that OBSpad doesn't.
title: "[Idea] "
labels: ["enhancement", "tester feedback"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping shape OBSpad! Tell us what you want to do, not only how.
  - type: textarea
    id: want
    attributes:
      label: What would you like to do?
      placeholder: During church service I want to show the Bible verse lower third on a timer, like I do in OBS on my laptop.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In OBS Studio, another app, or a workaround in OBSpad.
  - type: dropdown
    id: importance
    attributes:
      label: How important is it for you?
      options:
        - I can't use OBSpad without it
        - It would save me a lot of time
        - Nice to have
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Tablet model (optional)
      placeholder: Samsung Galaxy Tab S9, iPad Air…
