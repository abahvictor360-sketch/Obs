name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push makes older in-progress builds pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ffmpeg (RTMP end-to-end test server)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # NDI runtime is proprietary: only bundled when the repository variable
      # NDI_SDK_ACCEPT_LICENSE is set to 1 (= you accept https://ndi.video/sdk/).
      - name: Bundle NDI runtime (opt-in)
        if: vars.NDI_SDK_ACCEPT_LICENSE == '1'
        env:
          NDI_SDK_ACCEPT_LICENSE: '1'
        run: scripts/fetch_ndi_sdk.sh android

      - name: Build Android APK
        # Retries only cover network errors while downloading Gradle or Maven
        # dependencies (e.g. HTTP 503); a compile error fails every attempt.
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "APK build failed (attempt $i), retrying in $((i * 20)) s…"; sleep $((i * 20))
          done
          exit 1

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk obspad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: obspad-android-apk
          path: obspad.apk

      - name: Build web preview
        run: flutter build web --release --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        with:
          name: obspad-web
          path: build/web

  ios:
    # Compiles the iPad app and the ReplayKit screen broadcast extension.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Link NDI runtime (opt-in)
        if: vars.NDI_SDK_ACCEPT_LICENSE == '1'
        env:
          NDI_SDK_ACCEPT_LICENSE: '1'
        run: scripts/fetch_ndi_sdk.sh ios
      - name: Build iOS app + broadcast extension (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Check the extension is embedded
        run: test -d build/ios/iphoneos/Runner.app/PlugIns/BroadcastExtension.appex

      # Unsigned: sideload with your Apple ID (Sideloadly / AltStore), which
      # signs it for your iPad.
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry obspad-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: obspad-ios-ipa
          path: obspad-unsigned.ipa

  ndi-sdk:
    # Sends frames through the real NDI runtime and receives them back,
    # checking the Dart FFI bindings against the actual SDK.
    if: vars.NDI_SDK_ACCEPT_LICENSE == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch NDI SDK (Linux)
        env:
          NDI_SDK_ACCEPT_LICENSE: '1'
        run: scripts/fetch_ndi_sdk.sh linux
      - name: NDI send/receive test (real SDK)
        run: NDI_LIB=$PWD/build/ndi/linux/libndi.so flutter test test/ndi_test.dart

  release:
    # Publishes each successful build of the default branch, so
    # https://github.com/<owner>/<repo>/releases/latest/download/obspad.apk
    # always points at the newest test build.
    needs: [test-and-android, ios]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ObsPad test build ${{ github.run_number }}
          make_latest: true
          files: |
            dist/obspad.apk
            dist/obspad-unsigned.ipa
          body: |
            Test build from ${{ github.sha }}.

            **Android tablet:** download `obspad.apk`, open it, and allow installing from this source when asked.

            **iPad:** `obspad-unsigned.ipa` must be signed with your Apple ID: open it with
            [Sideloadly](https://sideloadly.io) or [AltStore](https://altstore.io) on a computer, with the iPad
            connected. Screen capture also needs the App Group set up (see README).

