name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ffmpeg (RTMP end-to-end test server)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: obs-tablet-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build web preview
        run: flutter build web --release --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        with:
          name: obs-tablet-web
          path: build/web

  ios:
    # Compiles the iPad app and the ReplayKit screen broadcast extension.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app + broadcast extension (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Check the extension is embedded
        run: test -d build/ios/iphoneos/Runner.app/PlugIns/BroadcastExtension.appex
